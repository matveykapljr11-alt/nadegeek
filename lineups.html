<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0C">
<title>Lineups</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:Archivo;src:local('Archivo');}
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0A0B0C; --surface:#131517; --surface2:#24282B; --sand:#241F18; --mapbg:#131110;
  --accent:#FF6B35; --accent2:#FF8B5E; --landing:#8FB3CC; --landing2:#A8C6DA;
  --text:#F5F6F7; --muted:#6B7278; --muted2:#7C838A; --dim:#5E656B; --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.055); --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --font:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

#app{position:fixed;inset:0;max-width:460px;margin:0 auto;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.05);display:flex;flex-direction:column}
.statusbar{height:calc(8px + var(--safe-top));padding-top:var(--safe-top);flex:none}

/* view system */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  opacity:0;visibility:hidden;transform:translateX(14px);transition:opacity .28s ease,transform .28s ease,visibility .28s;z-index:1}
.view.active{opacity:1;visibility:visible;transform:none;z-index:2}
.view.back{transform:translateX(-14px)}

/* labels */
.eyebrow{font:600 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.16em}
.tag{padding:5px 9px;border-radius:7px;font:700 9px/1 var(--mono);letter-spacing:.08em;display:inline-flex;align-items:center;white-space:nowrap}
.tag.smoke{background:rgba(255,107,53,.16);color:var(--accent2)}
.tag.flash{background:rgba(143,179,204,.16);color:var(--landing2)}
.tag.molotov{background:rgba(255,107,53,.16);color:var(--accent2)}
.tag.neutral{background:rgba(255,255,255,.06);color:#C3C9CE}
.tag.solid{background:rgba(255,107,53,.95);color:#0A0B0C}
.tag.line{background:rgba(10,11,12,.6);border:1px solid rgba(255,255,255,.12);color:#C3C9CE}

.btn-primary{height:46px;border-radius:14px;background:var(--text);color:#0A0B0C;display:flex;align-items:center;justify-content:center;gap:8px;font:700 13px/1 var(--font);letter-spacing:-.01em;width:100%}
.btn-accent{height:46px;border-radius:14px;background:var(--accent);color:#0A0B0C;display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font);width:100%}
.btn-sec{height:46px;border-radius:14px;background:#16191B;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font:600 12.5px/1 var(--font);color:#C3C9CE}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.press{transition:transform .08s ease}.press:active{transform:scale(.95)}

/* navbar */
.navbar{height:calc(58px + var(--safe-bot));padding:8px 14px var(--safe-bot);display:flex;align-items:flex-start;flex:none;
  background:var(--bg);border-top:1px solid var(--line2)}
.navbar.feed{background:var(--surface)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.nav-item span{font:600 8.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.nav-item svg{stroke:var(--dim)}
.nav-item.on span{color:var(--text)}.nav-item.on svg{stroke:var(--text)}

/* map header */
.map-head{padding:6px 20px 12px;flex:none}
.map-head .row{display:flex;align-items:flex-end;justify-content:space-between}
.map-title{display:flex;align-items:center;gap:9px;margin-top:8px}
.map-title b{font:700 25px/1 var(--font);letter-spacing:-.035em}
.head-ic{width:34px;height:34px;border-radius:11px;background:var(--surface);border:1px solid var(--line2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center}
.util-tabs{display:flex;align-items:center;gap:18px;padding:0 20px 11px;flex:none;border-bottom:1px solid var(--line2)}
.util{display:flex;align-items:baseline;gap:5px;padding-bottom:9px;margin-bottom:-11px;border-bottom:1.5px solid transparent}
.util b{font:500 13px/1 var(--font);color:var(--muted2);letter-spacing:-.01em}
.util i{font:600 9.5px/1 var(--mono);color:#565D63;font-style:normal}
.util.on{border-color:var(--accent)}
.util.on b{font-weight:700;color:var(--text)}.util.on i{color:var(--accent2)}
.list-toggle{margin-left:auto;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font:600 10px/1 var(--font);color:#C3C9CE}

/* map */
.map-wrap{flex:1;position:relative;overflow:hidden;background:var(--mapbg);touch-action:none}
.map-svg{position:absolute;inset:0;width:100%;height:100%}
.map-ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;border-radius:11px;overflow:hidden;background:rgba(14,15,16,.78);border:1px solid rgba(255,255,255,.08);z-index:5}
.map-ctrl button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font:400 16px/1 var(--font);color:#D6DADD}
.map-ctrl .sep{height:1px;background:rgba(255,255,255,.08)}
.legend{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:7px;padding:9px 11px;border-radius:10px;background:rgba(14,15,16,.72);border:1px solid var(--line);z-index:5}
.legend span{display:flex;align-items:center;gap:7px;font:600 8.5px/1 var(--mono);color:#B6BCC1;letter-spacing:.1em}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.callout{position:absolute;z-index:3;padding:5px 9px;border-radius:7px;background:rgba(10,11,12,.86);border:1px solid rgba(255,255,255,.09);
  font:600 9.5px/1 var(--mono);color:var(--text);letter-spacing:.06em;white-space:nowrap;pointer-events:none;transform:translate(-50%,-160%)}
.callout.accent{background:var(--accent);color:#0A0B0C;border:none;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* preview card */
.preview{margin:10px 14px 0;position:relative;z-index:4;flex:none}
.lcard{display:flex;gap:11px;padding:11px;border-radius:18px;background:rgba(19,21,23,.92);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 32px rgba(0,0,0,.55)}
.lcard .thumb{width:52px;height:66px;border-radius:10px;background:#0B0C0D;border:1px solid rgba(255,255,255,.06);flex:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.lcard .meta{flex:1;min-width:0;padding-top:2px}
.lcard .meta h4{font:700 14px/1.2 var(--font);letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .sub{display:flex;align-items:center;gap:7px;margin-top:7px;font:600 9.5px/1 var(--mono);color:var(--muted2);letter-spacing:.06em;white-space:nowrap}
.lcard .sub i{width:3px;height:3px;border-radius:50%;background:#3E444A;display:block}
.lcard .adv{color:var(--accent2)}
.lcard .chev{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none;align-self:center}
.pager{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:10px}
.pager .dots{display:flex;gap:4px}
.pager .dots i{width:5px;height:2px;border-radius:1px;background:rgba(255,255,255,.18);display:block;transition:width .2s,background .2s}
.pager .dots i.on{width:14px;background:var(--accent)}
.pager span{font:600 8.5px/1 var(--mono);color:rgba(255,255,255,.4);letter-spacing:.1em}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(4,5,6,.55);opacity:0;visibility:hidden;transition:opacity .3s;z-index:40}
.scrim.show{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#0E1011;border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;z-index:41;transform:translateY(100%);transition:transform .34s cubic-bezier(.22,.61,.36,1);
  max-width:460px;margin:0 auto;max-height:88%;display:flex;flex-direction:column;padding-bottom:var(--safe-bot)}
.sheet.show{transform:none}
.grip{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);margin:10px auto 0;flex:none}
.sheet-h{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 0;flex:none}
.sheet-h h3{font:700 18px/1 var(--font);letter-spacing:-.03em}
.sheet-body{overflow-y:auto;padding:0 18px 18px}

/* generic list rows */
.map-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line2)}
.map-row .mini{width:46px;height:46px;border-radius:12px;flex:none;overflow:hidden;background:var(--mapbg);position:relative}
.map-row .info{flex:1;min-width:0}
.map-row .info b{font:700 16px/1 var(--font);letter-spacing:-.02em}
.map-row .info span{font:600 9px/1.4 var(--mono);color:var(--muted2);letter-spacing:.08em;display:block;margin-top:6px}
.map-row .cnt{font:600 10px/1 var(--mono);color:var(--dim)}

.chip{padding:9px 14px;border-radius:11px;font:600 12px/1 var(--font);color:#9AA1A7;background:#16191B;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--surface2);border-color:rgba(255,255,255,.12);color:var(--text);font-weight:700}
.chip.acc-on{background:var(--accent);border:none;color:#0A0B0C;font-weight:700}

.seg{display:flex;background:#16191B;border:1px solid var(--line2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 0;text-align:center;border-radius:9px;font:600 12px/1 var(--font);color:var(--muted2)}
.seg button.on{background:var(--surface2);color:var(--text);font-weight:700}

.toggle{width:42px;height:25px;border-radius:13px;background:var(--surface2);padding:2px;box-sizing:border-box;display:flex;flex:none;transition:background .2s}
.toggle i{width:21px;height:21px;border-radius:50%;background:#5E656B;transition:transform .2s,background .2s;display:block}
.toggle.on{background:var(--accent)}.toggle.on i{background:#0A0B0C;transform:translateX(17px)}

/* feed */
.fv{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.feed-track{flex:1;position:relative;overflow:hidden}
.feed-slide{position:absolute;inset:0;transition:transform .38s cubic-bezier(.22,.61,.36,1)}
.feed-media{position:absolute;inset:0;background:#101112;overflow:hidden}
.feed-media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:500 9.5px/1.6 var(--mono);color:#3A4045;letter-spacing:.12em}
.grad-t{position:absolute;left:0;right:0;top:0;height:190px;background:linear-gradient(to bottom,rgba(6,7,8,.82),transparent)}
.grad-b{position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(to top,rgba(6,7,8,.96) 14%,rgba(6,7,8,.5) 48%,transparent)}
.feed-rail{position:absolute;right:14px;bottom:120px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:6}
.frail{display:flex;flex-direction:column;align-items:center;gap:5px}
.frail .b{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.frail span{font:600 9px/1 var(--mono);color:#C3C9CE}
.feed-cap{position:absolute;left:20px;right:76px;bottom:26px;z-index:6}
.feed-cap h3{font:700 20px/1.2 var(--font);letter-spacing:-.03em;margin-top:11px}
.feed-cap .sub{display:flex;align-items:center;gap:8px;margin-top:10px;font:600 10px/1 var(--mono);color:#A8AFB5;letter-spacing:.06em}
.feed-cap .sub i{width:3px;height:3px;border-radius:50%;background:#4A5157;display:block}
.feed-cap .auth{display:flex;align-items:center;gap:8px;margin-top:14px}
.feed-cap .auth .av{width:24px;height:24px;border-radius:50%;background:#242729;border:1px solid rgba(255,255,255,.09)}
.feed-cap .auth span{font:600 11px/1 var(--font);color:#C3C9CE}
.feed-hint{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 0;z-index:6}
.feed-hint span{font:600 8.5px/1 var(--mono);color:rgba(255,255,255,.4);letter-spacing:.14em}
.feed-tabs{position:relative;z-index:7;padding:6px 20px 0;display:flex;align-items:center;gap:20px;flex:none}
.feed-tabs button{font:500 13px/1 var(--font);letter-spacing:-.015em;color:rgba(245,246,247,.55);padding-bottom:6px;border-bottom:1.5px solid transparent}
.feed-tabs button.on{font-weight:700;color:var(--text);border-color:var(--text)}

/* detail */
.detail-media{position:absolute;left:0;right:0;top:0;height:56%;background:#101112;border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden}
.detail-media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:500 9.5px/1.6 var(--mono);color:#3E444A;letter-spacing:.1em}
.detail-fade{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(to top,var(--bg) 12%,transparent);z-index:2}
.detail-top{position:relative;z-index:5;padding:4px 16px 0;display:flex;align-items:center;justify-content:space-between;flex:none}
.rounded{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center}
.prog{display:flex;gap:4px;flex:1;margin:0 14px}
.prog i{flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,.22);display:block}
.prog i.on{background:rgba(255,255,255,.85)}
.detail-info{position:relative;z-index:5;margin-top:auto;padding:0 20px}
.detail-info h2{font:700 22px/1.16 var(--font);letter-spacing:-.03em;max-width:250px}
.route{display:flex;align-items:center;gap:9px;margin-top:11px}
.route span{display:flex;align-items:center;gap:6px;font:600 11.5px/1 var(--font);color:#D6DADD}
.route i{width:9px;height:9px;border-radius:50%;display:block}
.steps{display:flex;gap:10px;margin-top:18px}
.step{flex:1;height:118px;border-radius:14px;background:#0F1011;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
.step .lbl{position:absolute;left:9px;top:9px;z-index:2;padding:4px 7px;border-radius:6px;background:rgba(10,11,12,.85);border:1px solid rgba(255,255,255,.12);font:700 8.5px/1 var(--mono);letter-spacing:.08em}
.diffbars{display:flex;gap:2px}
.diffbars i{width:4px;height:9px;border-radius:1px;background:#2E3439;display:block}
.diffbars i.on{background:var(--accent)}
.detail-actions{position:relative;z-index:5;padding:16px 20px calc(20px + var(--safe-bot));display:flex;align-items:center;gap:10px;flex:none}

/* scroll list view */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:0 20px}
.list-card{display:flex;gap:11px;padding:11px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-top:10px}
.list-card .th{width:44px;height:56px;border-radius:9px;background:#0F1011;border:1px solid rgba(255,255,255,.06);flex:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.list-card .cc{flex:1;min-width:0;padding-top:1px}
.list-card .cc h4{font:700 14px/1.2 var(--font);letter-spacing:-.015em}
.list-card .cc .r2{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.grp-h{display:flex;align-items:center;gap:8px;margin:22px 0 2px;font:600 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.12em}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;gap:14px}
.empty h3{font:700 17px/1.3 var(--font);letter-spacing:-.02em}
.empty p{font:400 12.5px/1.55 var(--font);color:var(--muted2);max-width:250px}

/* profile */
.prof-head{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
.prof-av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#2a2320,#161819);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font:700 20px/1 var(--font);color:var(--accent2)}
.prem{border-radius:16px;background:linear-gradient(135deg,rgba(255,107,53,.14),rgba(255,107,53,.04));border:1px solid rgba(255,107,53,.22);padding:16px;margin-top:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line2)}
.set-row .k{font:600 13px/1 var(--font);color:#D6DADD}
.set-row .v{font:600 12px/1 var(--mono);color:var(--muted2)}
.stat3{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}
.stat b{font:700 20px/1 var(--font);letter-spacing:-.02em}
.stat span{font:600 8.5px/1.3 var(--mono);color:var(--dim);letter-spacing:.08em;display:block;margin-top:6px}

/* onboarding */
.onb-map{position:absolute;left:0;right:0;top:0;height:64%;background:var(--mapbg);overflow:hidden}
.onb-fade{position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(to top,var(--bg) 12%,transparent)}
.brand{display:flex;align-items:center;gap:8px}
.brand .mk{width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.brand b{font:700 14px/1 var(--font);letter-spacing:-.02em}
.onb-title{font:700 34px/1.05 var(--font);letter-spacing:-.04em}
.onb-feat{display:flex;align-items:center;gap:11px}
.onb-feat .d{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.onb-feat span{font:600 12.5px/1 var(--font);color:#D6DADD}

.toast{position:absolute;left:50%;bottom:calc(78px + var(--safe-bot));transform:translateX(-50%) translateY(10px);
  background:rgba(20,22,24,.96);border:1px solid var(--line);color:var(--text);font:600 12px/1 var(--font);
  padding:11px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}
.spin{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.12);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.marker{cursor:pointer}
.pulse{animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{r:15;opacity:.5}70%,100%{r:30;opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div class="statusbar"></div>
  <div id="stage" style="position:relative;flex:1;overflow:hidden"></div>
</div>

<script>
"use strict";
/* ---------- Telegram bootstrap ---------- */
const TG = window.Telegram && window.Telegram.WebApp;
try{ if(TG){ TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#0A0B0C'); TG.setBackgroundColor && TG.setBackgroundColor('#0A0B0C'); } }catch(e){}
function haptic(t){ try{ if(!TG||!TG.HapticFeedback)return; if(t==='sel')TG.HapticFeedback.selectionChanged(); else if(t==='heavy')TG.HapticFeedback.impactOccurred('medium'); else if(t==='soft')TG.HapticFeedback.impactOccurred('light'); else TG.HapticFeedback.notificationOccurred(t);}catch(e){} }

/* ---------- Backend (Telegram-first, с офлайн-фолбэком) ---------- */
const CFG = window.LINEUPS_CONFIG || {enabled:false};
const START_PARAM = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || '';
const ME = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || null;
function myHandle(){ return ME ? (ME.username ? '@'+ME.username : (ME.first_name||'Игрок')) : '@you'; }
function myInitial(){ const h=myHandle().replace('@',''); return (h[0]||'U').toUpperCase(); }
let SERVER_OK=false, startHandled=false, SYNC_ERR='';
function api(pathname, body){
  const headers={'Content-Type':'application/json'};
  try{ if(TG&&TG.initData) headers['X-Init-Data']=TG.initData; }catch(e){}
  return fetch((CFG.apiBase||'')+pathname, {method:body?'POST':'GET', headers, body:body?JSON.stringify(body):undefined})
    .then(r=>r.ok?r.json():Promise.reject(r.status));
}

/* ---------- Throw animation engine ---------- */
let anim={raf:null};
function stopAnim(){ if(anim.raf)cancelAnimationFrame(anim.raf); anim.raf=null; }
function apex(from,to){ return {x:(from.x+to.x)/2, y:Math.min(from.y,to.y)-70}; }
function throwSvg(l,opts){
  opts=opts||{}; const from=l.from,to=l.to,c=apex(from,to); const b=opts.bright||.6;
  return `<svg class="throwSvg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">
    <g style="filter:brightness(${b})">${radar(MAPS[l.map].radar)}</g>
    <path d="M${from.x} ${from.y}Q${c.x} ${c.y} ${to.x} ${to.y}" stroke="#FF6B35" stroke-width="2" fill="none" stroke-dasharray="2 7" opacity=".45"/>
    <g class="effG" style="opacity:0"><circle class="e1" cx="${to.x}" cy="${to.y}" r="8"/><circle class="e2" cx="${to.x}" cy="${to.y}" r="4"/></g>
    <g class="landG" style="opacity:0"><path d="M${to.x} ${to.y-9}v6M${to.x} ${to.y+3}v6M${to.x-9} ${to.y}h6M${to.x+3} ${to.y}h6" stroke="#8FB3CC" stroke-width="1.8"/><circle cx="${to.x}" cy="${to.y}" r="5.5" fill="#8FB3CC"/></g>
    <circle cx="${from.x}" cy="${from.y}" r="11" fill="#FF6B35" stroke="#0A0B0C" stroke-width="2.5"/>
    <path d="M${from.x} ${from.y-6}v12M${from.x-6} ${from.y}h12" stroke="#0A0B0C" stroke-width="2" stroke-linecap="round"/>
    <circle class="nade" cx="${from.x}" cy="${from.y}" r="6" fill="#F5F6F7" stroke="#0A0B0C" stroke-width="1.5" style="opacity:0"/>
  </svg>`;
}
function playThrow(root,l,getSpeed){
  stopAnim(); if(!root)return; const svg=root.querySelector('.throwSvg'); if(!svg)return;
  const from=l.from,to=l.to,c=apex(from,to);
  const nade=svg.querySelector('.nade'),eff=svg.querySelector('.effG'),land=svg.querySelector('.landG'),e1=svg.querySelector('.e1'),e2=svg.querySelector('.e2');
  const ease=t=>1-Math.pow(1-t,1.9);
  const setEff=(type,t)=>{
    if(type==='smoke'){ const r=8+40*ease(t); e1.setAttribute('r',r); e1.setAttribute('fill','rgba(150,168,186,.30)'); e2.setAttribute('r',4+24*ease(t)); e2.setAttribute('fill','rgba(190,202,214,.42)'); }
    else if(type==='flash'){ const q=Math.min(1,t*2.2); e1.setAttribute('r',10+70*q); e1.setAttribute('fill','rgba(255,255,255,'+Math.max(0,.9-q)+')'); e2.setAttribute('r',6+30*q); e2.setAttribute('fill','rgba(255,255,255,'+Math.max(0,1-q*1.3)+')'); }
    else { const fl=.85+.15*Math.sin(t*38); const r=(8+30*ease(t))*fl; e1.setAttribute('r',r); e1.setAttribute('fill','rgba(255,107,53,.34)'); e2.setAttribute('r',(4+16*ease(t))*fl); e2.setAttribute('fill','rgba(255,178,110,.6)'); }
  };
  const flyD=2000,holdD=1500; let last=null,acc=0;
  function frame(ts){ if(last==null)last=ts; const sp=getSpeed?getSpeed():1; acc=(acc+(ts-last)*sp)%(flyD+holdD); last=ts; const el=acc;
    if(el<flyD){ const t=el/flyD,it=ease(t); const x=(1-it)*(1-it)*from.x+2*(1-it)*it*c.x+it*it*to.x; const y=(1-it)*(1-it)*from.y+2*(1-it)*it*c.y+it*it*to.y; nade.setAttribute('cx',x);nade.setAttribute('cy',y);nade.style.opacity=1;eff.style.opacity=0;land.style.opacity=0; }
    else { const t=(el-flyD)/holdD; nade.style.opacity=0; eff.style.opacity=1; land.style.opacity=Math.min(1,t*5); setEff(l.type,t); }
    anim.raf=requestAnimationFrame(frame);
  }
  anim.raf=requestAnimationFrame(frame);
}

function mapSvg(list,sel){
  const markers = list.map((l,i)=>{
    const on = i===state.sel;
    if(on){
      return `<g class="marker" data-i="${i}">
        <path d="M${l.from.x} ${l.from.y}Q${(l.from.x+l.to.x)/2} ${Math.min(l.from.y,l.to.y)-60} ${l.to.x} ${l.to.y}" stroke="url(#arcm)" stroke-width="2" fill="none" stroke-dasharray="1.5 6" stroke-linecap="round"/>
        <g fill="none" stroke="#8FB3CC" stroke-width="1.6"><path d="M${l.to.x} ${l.to.y-8}v9M${l.to.x} ${l.to.y+8}v9M${l.to.x-9} ${l.to.y}h9M${l.to.x+9} ${l.to.y}h9" transform="translate(0,-8.5) translate(0,0)"/></g>
        <path d="M${l.to.x} ${l.to.y-9}v6M${l.to.x} ${l.to.y+3}v6M${l.to.x-9} ${l.to.y}h6M${l.to.x+3} ${l.to.y}h6" stroke="#8FB3CC" stroke-width="1.6"/>
        <circle cx="${l.to.x}" cy="${l.to.y}" r="6" fill="#8FB3CC"/>
        <circle class="pulse" cx="${l.from.x}" cy="${l.from.y}" fill="#FF6B35" opacity=".1"/>
        <circle cx="${l.from.x}" cy="${l.from.y}" r="15" fill="#FF6B35" stroke="#0A0B0C" stroke-width="2.5"/>
        <path d="M${l.from.x} ${l.from.y-7}v14M${l.from.x-7} ${l.from.y}h14" stroke="#0A0B0C" stroke-width="2.2" stroke-linecap="round"/>
      </g>`;
    }
    const st=l.visited?'#585044':'#8A806C', dt=l.visited?'#6E6656':'#B0A48A';
    return `<g class="marker" data-i="${i}"><circle cx="${l.from.x}" cy="${l.from.y}" r="12" fill="transparent"/><circle cx="${l.from.x}" cy="${l.from.y}" r="9" fill="#0A0B0C" opacity=".5"/><circle cx="${l.from.x}" cy="${l.from.y}" r="9" fill="none" stroke="${st}" stroke-width="1.3"/><circle cx="${l.from.x}" cy="${l.from.y}" r="3.4" fill="${dt}"/></g>`;
  }).join('');
  const s = list[state.sel];
  return `
  <svg class="map-svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice" id="mapSvg">
    <defs><linearGradient id="arcm" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF6B35" stop-opacity=".95"/><stop offset="1" stop-color="#FF6B35" stop-opacity=".28"/></linearGradient></defs>
    <g id="mapG">${radar(MAPS[state.map].radar)}<g style="filter:brightness(.55)">${''}</g>${markers}</g>
  </svg>
  <div class="callout" style="left:${s.to.x/512*100}%;top:${s.to.y/512*100}%" id="calloutTo">${esc(s.to.n)}</div>
  <div class="callout accent" style="left:${s.from.x/512*100}%;top:${s.from.y/512*100}%">${esc(s.from.n)} · ${state.sel+1}</div>`;
}

window.uploadMapImg=function(id,input){
  const f=input.files&&input.files[0]; if(!f)return;
  if(f.size>12*1024*1024){ toast('Картинка больше 12 МБ'); input.value=''; return; }
  toast('Загружаем фон…');
  const headers={'Content-Type':f.type||'image/jpeg'};
  try{ if(TG&&TG.initData) headers['X-Init-Data']=TG.initData; }catch(e){}
  fetch((CFG.apiBase||'')+'/api/mapimg?map='+encodeURIComponent(id),{method:'POST',headers,body:f})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(()=>{ MAP_IMG[id]=(CFG.apiBase||'')+'/api/mapimg?map='+encodeURIComponent(id)+'&t='+Date.now(); haptic('success'); toast('Фон карты обновлён'); openMapPicker(); })
    .catch(err=>{ toast(err===403?'Менять фон может только владелец':'Не удалось загрузить'); });
};

window.toggleFilter=function(g,v){ const a=state.filters[g]; const i=a.indexOf(v); if(i<0)a.push(v);else a.splice(i,1); openFilters(); haptic('sel'); };
window.resetFilters=function(){ state.filters={types:[],sides:[],zones:[],diffs:[],savedOnly:false}; openFilters(); haptic('soft'); };
window.applyFilters=function(){ closeSheet(); go('list',{tab:'list',listTab:'all'}); };
function filteredForList(){
  const f=state.filters;
  return LINEUPS.filter(l=>{
    if(f.types.length&&!f.types.includes(l.type))return false;
    if(f.sides.length&&!f.sides.includes(l.side))return false;
    if(f.zones.length&&!f.zones.includes(l.zone))return false;
    if(f.diffs.length&&!f.diffs.includes(l.diff))return false;
    if(f.savedOnly&&!l.saved)return false;
    return true;
  });
}

function attachFeedSwipe(list){
  const track=document.getElementById('feedTrack'); const slide=document.getElementById('feedSlide');
  if(!track)return; let sy=0,dy=0,drag=false;
  const start=y=>{sy=y;drag=true;dy=0;};
  const move=y=>{ if(!drag)return; dy=y-sy; slide.style.transition='none'; slide.style.transform=`translateY(${dy*0.6}px)`; };
  const end=()=>{ if(!drag)return; drag=false; slide.style.transition='transform .3s'; if(Math.abs(dy)>70){ const dir=dy<0?1:-1; feedStep(dir,list); } else slide.style.transform='none'; };
  track.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
  track.addEventListener('touchmove',e=>move(e.touches[0].clientY),{passive:true});
  track.addEventListener('touchend',end);
  let wl=0; track.addEventListener('wheel',e=>{ const now=Date.now(); if(now-wl<600)return; if(Math.abs(e.deltaY)>20){ wl=now; feedStep(e.deltaY>0?1:-1,list);} },{passive:true});
  track.addEventListener('click',()=>openDetail(list[state.feedIdx].id,'feed'));
}
function feedStep(dir,list){ let ni=state.feedIdx+dir; if(ni<0)ni=list.length-1; if(ni>=list.length)ni=0; const slide=document.getElementById('feedSlide'); slide.style.transform=`translateY(${dir<0?100:-100}%)`; setTimeout(()=>{ state.feedIdx=ni; renderFeed(); },260); haptic('soft'); }

      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px">${mapsChips}</div>
      <div class="seg" style="margin-top:10px">
        <button class="${createPlacing==='from'?'on':''}" onclick="createPlacing='from';renderCreate()"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1.6px solid #FF6B35;margin-right:6px;vertical-align:middle"></span>Откуда${createFrom?' ✓':''}</button>
        <button class="${createPlacing==='to'?'on':''}" onclick="createPlacing='to';renderCreate()"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#8FB3CC;margin-right:6px;vertical-align:middle"></span>Куда${createTo?' ✓':''}</button>
      </div>
    </div>
    <div style="padding:12px 20px 0;flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
      <div id="createMap" onclick="mapTap(event)" style="width:100%;aspect-ratio:1;max-height:100%;border-radius:16px;overflow:hidden;position:relative;background:var(--mapbg);border:1px solid var(--line);cursor:crosshair;touch-action:manipulation">
        <svg viewBox="0 0 512 512" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">${radar(MAPS[createMap].radar)}
          ${ready?`<path d="M${createFrom.x} ${createFrom.y}Q${(createFrom.x+createTo.x)/2} ${Math.min(createFrom.y,createTo.y)-60} ${createTo.x} ${createTo.y}" stroke="#FF6B35" stroke-width="2" fill="none" stroke-dasharray="2 6"/>`:''}
          ${createFrom?`<circle cx="${createFrom.x}" cy="${createFrom.y}" r="13" fill="#FF6B35" stroke="#0A0B0C" stroke-width="2.5"/><path d="M${createFrom.x} ${createFrom.y-6}v12M${createFrom.x-6} ${createFrom.y}h12" stroke="#0A0B0C" stroke-width="2" stroke-linecap="round"/>`:''}
          ${createTo?`<path d="M${createTo.x} ${createTo.y-9}v6M${createTo.x} ${createTo.y+3}v6M${createTo.x-9} ${createTo.y}h6M${createTo.x+3} ${createTo.y}h6" stroke="#8FB3CC" stroke-width="1.8"/><circle cx="${createTo.x}" cy="${createTo.y}" r="6" fill="#8FB3CC"/>`:''}
        </svg>
      </div>
    </div>
    <div style="padding:10px 20px 0;flex:none;display:flex;gap:10px">
      <input value="${esc(createFromN)}" placeholder="Откуда · напр. TR Spawn" oninput="createFromN=this.value" style="flex:1;min-width:0;background:#16191B;border:1px solid var(--line2);border-radius:11px;padding:11px 12px;color:var(--text);font:600 12px/1 var(--font);outline:none">
      <input value="${esc(createToN)}" placeholder="Куда · напр. A Site" oninput="createToN=this.value" style="flex:1;min-width:0;background:#16191B;border:1px solid var(--line2);border-radius:11px;padding:11px 12px;color:var(--text);font:600 12px/1 var(--font);outline:none">
    </div>
    <p style="padding:8px 20px 0;font:400 11.5px/1.45 var(--font);color:var(--muted2);flex:none">${!createFrom?'Тапни по карте, где ты стоишь (откуда бросаешь).':(!createTo?'Теперь тапни, куда прилетает граната.':'Готово. Чтобы поправить — выбери «Откуда»/«Куда» сверху и тапни заново.')}</p>
    <div style="padding:12px 20px calc(14px + var(--safe-bot));flex:none"><button class="btn-primary press" ${ready?'':'style="opacity:.45;pointer-events:none"'} onclick="createNext()">Дальше · параметры<svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#0A0B0C" stroke-width="2">${IC.chevR}</svg></button></div>`;
  }
  else { inner=`${head('Параметры','ВСЁ ГОТОВО')}
    <div class="scroll pad" style="padding-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:11px;min-width:0"><div style="width:40px;height:40px;border-radius:10px;background:#0F1011;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center">${createVideo?`<video src="${URL.createObjectURL(createVideo)}" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>`:`<svg width="14" height="14" viewBox="0 0 16 16" fill="#FF6B35">${IC.play}</svg>`}</div><div style="min-width:0"><div style="font:600 11px/1 var(--font)">${createVideo?'Видео выбрано':'Без видео'} · ${MAPS[createMap].name}</div><div style="font:600 9px/1 var(--mono);color:var(--muted2);letter-spacing:.06em;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((createFromN||'Откуда').toUpperCase())} → ${esc((createToN||'Куда').toUpperCase())}</div></div></div>
        <button class="press" onclick="state.createStep=0;renderCreate()" style="font:600 10px/1 var(--mono);color:var(--accent2);letter-spacing:.08em;flex:none">ИЗМЕНИТЬ</button>
      </div>
      <div class="eyebrow" style="margin-top:20px">НАЗВАНИЕ</div>
      <input id="cName" value="One-way smoke на плато" oninput="this.nextElementSibling.textContent=this.value.length+' / 90'" style="width:100%;margin-top:10px;background:#16191B;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--text);font:600 14px/1 var(--font);outline:none">
      <div style="font:600 9px/1 var(--mono);color:var(--dim);text-align:right;margin-top:6px">22 / 90</div>
      <div class="eyebrow" style="margin-top:18px">ТИП</div>
      <div style="display:flex;gap:8px;margin-top:10px" id="cType">${['SMOKE','FLASH','MOLO'].map((t,i)=>`<button class="chip ${i===0?'acc-on':''} press" onclick="pickOne('cType',this)">${t}</button>`).join('')}</div>
      <div class="eyebrow" style="margin-top:18px">СТОРОНА</div>
      <div style="display:flex;gap:8px;margin-top:10px" id="cSide">${['АТАКА','ЗАЩИТА'].map((t,i)=>`<button class="chip ${i===0?'on':''} press" onclick="pickOne('cSide',this)">${t}</button>`).join('')}</div>
      <div class="eyebrow" style="margin-top:18px">СЛОЖНОСТЬ</div>
      <div style="display:flex;gap:8px;margin-top:10px" id="cDiff">${['EASY','ADV'].map((t,i)=>`<button class="chip ${i===1?'on':''} press" onclick="pickOne('cDiff',this)">${t}</button>`).join('')}</div>
      <div class="eyebrow" style="margin-top:18px">ТИП БРОСКА</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap" id="cThrow">${['Stand','Jump','Run','Jump throw'].map((t,i)=>`<button class="chip ${i===1?'on':''} press" onclick="pickOne('cThrow',this)">${t}</button>`).join('')}</div>
      <div class="eyebrow" style="margin-top:18px">ЗОНА</div>
      <div style="display:flex;gap:8px;margin-top:10px" id="cZone">${['A','Mid','B','Long'].map((z,i)=>`<button class="chip ${i===0?'on':''} press" onclick="pickOne('cZone',this)">${z}</button>`).join('')}</div>
      <div class="eyebrow" style="margin-top:18px">ДЛИТЕЛЬНОСТЬ${createVideo?' · ИЗ ВИДЕО':''}</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap" id="cDur">${[createDur,'0:03','0:04','0:05','0:06','0:07','0:08','0:10'].filter((d,i,a)=>a.indexOf(d)===i).map(d=>`<button class="chip ${d===createDur?'on':''} press" onclick="pickOne('cDur',this)">${d}</button>`).join('')}</div>
      <div class="eyebrow" style="margin-top:18px">ОПИСАНИЕ · 1 ПРЕДЛОЖЕНИЕ</div>
      <textarea id="cDesc" rows="2" oninput="this.nextElementSibling.textContent=this.value.length+' / 90'" style="width:100%;margin-top:10px;background:#16191B;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--text);font:500 13px/1.4 var(--font);outline:none;resize:none">Прицел в правый край антенны, прыжок и бросок одновременно.</textarea>
      <div style="font:600 9px/1 var(--mono);color:var(--dim);text-align:right;margin-top:6px">58 / 90</div>
    </div>
    <div style="padding:12px 20px calc(14px + var(--safe-bot));flex:none;display:flex;gap:10px">
      <button class="btn-sec press" style="flex:none;padding:0 18px" onclick="toast('Сохранено в черновики')">Черновик</button>
      <button class="btn-accent press" onclick="publishLineup()">Опубликовать</button>
    </div>`;
  }
  stage.innerHTML=`<div class="view active">${inner}</div>`;
}
window.startCreate=function(){ createVideo=null; createMap='sandstone'; createFrom=null; createTo=null; createPlacing='from'; createFromN=''; createToN=''; createDur='0:06'; go('create',{createStep:0}); };
window.setCreateMap=function(id){ if(createMap!==id){ createMap=id; createFrom=null; createTo=null; createPlacing='from'; } renderCreate(); haptic('sel'); };
window.mapTap=function(e){ const el=document.getElementById('createMap'); if(!el)return; const r=el.getBoundingClientRect(); const px=(e.touches?e.touches[0].clientX:e.clientX), py=(e.touches?e.touches[0].clientY:e.clientY); const x=Math.max(8,Math.min(504,(px-r.left)/r.width*512)); const y=Math.max(8,Math.min(504,(py-r.top)/r.height*512)); if(createPlacing==='from'){ createFrom={x,y}; createPlacing='to'; } else { createTo={x,y}; } haptic('sel'); renderCreate(); };
window.onVideoPick=function(input){ const f=input.files&&input.files[0]; if(!f)return; if(f.size>32*1024*1024){ toast('Видео больше 32 МБ'); input.value=''; return; } createVideo=f; haptic('sel');
  try{ const uu=URL.createObjectURL(f); const v=document.createElement('video'); v.preload='metadata'; v.onloadedmetadata=function(){ if(v.duration&&isFinite(v.duration)){ const s=Math.min(99*60,Math.round(v.duration)); createDur=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(state.view==='create'&&state.createStep===2)renderCreate(); } URL.revokeObjectURL(uu); }; v.src=uu; }catch(e){}
  renderCreate(); };
window.createBack=function(){ if(state.createStep>0){ state.createStep--; renderCreate(); } else go('author'); };
window.createNext=function(){ state.createStep++; renderCreate(); haptic('sel'); };
window.pickOne=function(grp,el){ document.getElementById(grp).querySelectorAll('.chip').forEach(c=>{c.classList.remove('acc-on','on'); c.classList.add('chip');}); const acc=grp==='cType'; el.classList.add(acc?'acc-on':'on'); haptic('sel'); };
function selChip(grp){ const g=document.getElementById(grp); if(!g)return''; const on=g.querySelector('.acc-on,.on'); return on?on.textContent.trim():''; }
window.publishLineup=function(){
  const name=((document.getElementById('cName')||{}).value||'').trim()||'Новая раскидка';
  const type=({SMOKE:'smoke',FLASH:'flash',MOLO:'molotov'})[selChip('cType')]||'smoke';
  const side=selChip('cSide')==='ЗАЩИТА'?'defense':'attack';
  const diff=selChip('cDiff')==='ADV'?'advanced':'easy';
  const dd=((document.getElementById('cDesc')||{}).value||'').trim();
  const thr=selChip('cThrow')||'Jump';
  const zone=['A','Mid','B','Long'].includes(selChip('cZone'))?selChip('cZone'):'A';
  const dur=/^\d:\d\d$/.test(selChip('cDur'))?selChip('cDur'):(createDur||'0:06');
  const fromP={x:createFrom?createFrom.x:300,y:createFrom?createFrom.y:470,n:(createFromN.trim()||'Откуда')};
  const toP={x:createTo?createTo.x:120,y:createTo?createTo.y:140,n:(createToN.trim()||'Куда')};
  const proceed=(videoId,videoUrl)=>{
    const payload={map:createMap,side,type,zone,title:name,from:fromP,to:toP,thr,dur,diff,desc:dd,aim:toP.n,video:videoId||''};
    const finish=(lin,msg)=>{ lin.auth=0; lin.mine=true; if(videoUrl&&!lin.videoUrl)lin.videoUrl=videoUrl; if(!LINEUPS.find(x=>x.id===lin.id))LINEUPS.push(lin); haptic('success'); toast(msg||'Раскидка опубликована · видна на карте'); setTimeout(()=>go('author'),800); };
    const local=()=>{ const id='u'+Date.now(); const nl=L(id,createMap,side,type,zone,name,fromP.x,fromP.y,fromP.n,toP.x,toP.y,toP.n,thr,dur,diff,0); nl.desc=dd; nl.aim=toP.n; if(videoUrl)nl.videoUrl=videoUrl; finish(nl); };
    if(SERVER_OK){ api('/api/submit',{lineup:payload}).then(d=>{ if(d&&d.lineup)finish(d.lineup, d.lineup.pending?'Отправлено на модерацию':'Раскидка опубликована · видна на карте'); else local(); }).catch(local); }
    else local();
  };
  if(createVideo){
    const localUrl=URL.createObjectURL(createVideo);
    if(SERVER_OK){ toast('Загружаем видео…'); uploadVideo(createVideo).then(id=>proceed(id,localUrl)).catch(()=>{ toast('Видео не загрузилось — публикую без него'); proceed('',localUrl); }); }
    else proceed('',localUrl);
  } else proceed('','');
};

/* ===== navbar ===== */
function navbar(active){
  const items=[['map','map','КАРТА'],['feed','feed','ЛЕНТА'],['list','save','SAVED'],['profile','more','ЕЩЁ']];
  return `<div class="navbar ${active==='feed'?'feed':''}">${items.map(it=>`
    <button class="nav-item ${active===it[0]?'on':''} press" onclick="tabTo('${it[0]}')">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke-width="1.5">${IC[it[1]]}</svg><span>${it[2]}</span>
    </button>`).join('')}</div>`;
}
window.tabTo=function(t){ if(t==='list'){ go('list',{tab:'list',listTab:'saved'}); return; } if(t==='map'){ go('map',{tab:'map'}); return; } go(t,{tab:t}); };

/* ===== sheet plumbing ===== */
let sheetEl=null,scrimEl=null;
function ensureSheet(){
  if(sheetEl)return;
  scrimEl=document.createElement('div'); scrimEl.className='scrim'; scrimEl.onclick=closeSheet;
  sheetEl=document.createElement('div'); sheetEl.className='sheet';
  document.getElementById('app').appendChild(scrimEl); document.getElementById('app').appendChild(sheetEl);
}
function openSheet(html,cb){ ensureSheet(); sheetEl.innerHTML='<div class="grip"></div>'+html; scrimEl.classList.add('show'); requestAnimationFrame(()=>sheetEl.classList.add('show')); attachSheetDrag(); if(cb)cb(); }
function closeSheet(){ if(!sheetEl)return; sheetEl.classList.remove('show'); scrimEl.classList.remove('show'); }
function sheetClosed(){ return !sheetEl || !sheetEl.classList.contains('show'); }
window.closeSheet=closeSheet;
function attachSheetDrag(){
  const grip=sheetEl.querySelector('.grip'); if(!grip)return; let sy=0,dy=0,drag=false;
  const start=y=>{sy=y;drag=true;dy=0;sheetEl.style.transition='none';};
  const move=y=>{ if(!drag)return; dy=Math.max(0,y-sy); sheetEl.style.transform=`translateY(${dy}px)`; };
  const end=()=>{ if(!drag)return;drag=false; sheetEl.style.transition=''; if(dy>90)closeSheet(); else sheetEl.style.transform=''; };
  grip.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
  grip.addEventListener('touchmove',e=>move(e.touches[0].clientY),{passive:true});
  grip.addEventListener('touchend',end);
}

/* ===== toast ===== */
let toastEl=null,toastT=null;
function toast(msg){ if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.getElementById('app').appendChild(toastEl);} toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1900); }

/* ===== Telegram BackButton ===== */
function syncBack(){ try{ if(!TG||!TG.BackButton)return; const show=['detail','author','create','admin'].includes(state.view)||(state.view==='onb1'); if(show)TG.BackButton.show(); else TG.BackButton.hide(); }catch(e){} }
try{ if(TG&&TG.BackButton){ TG.BackButton.onClick(()=>{ if(!sheetClosed()){closeSheet();return;} if(state.view==='detail')backFromDetail(); else if(state.view==='author'||state.view==='admin')go('profile',{tab:'profile'}); else if(state.view==='create')createBack(); else if(state.view==='onb1')go('onb0'); }); } }catch(e){}
const _render=render;
render=function(){ _render(); syncBack(); };

/* ===== boot ===== */
if(PREFS.map&&MAPS[PREFS.map])state.map=PREFS.map;
if(PREFS.side)state.side=PREFS.side;
if(PREFS.type)state.type=PREFS.type;

// deep-link: открыть расшаренную раскидку по startapp=<id>
function openStartParam(){
  if(startHandled||!START_PARAM) return;
  const l=LINEUPS.find(x=>x.id===START_PARAM);
  if(l){ startHandled=true; state.seenOnb=true; try{localStorage.setItem('lu_onb','1');}catch(e){} openDetail(l.id,'map'); return; }
  if(SERVER_OK){ startHandled=true; api('/api/lineup?id='+encodeURIComponent(START_PARAM)).then(d=>{ if(d&&d.lineup){ if(!LINEUPS.find(x=>x.id===d.lineup.id))LINEUPS.push(d.lineup); state.seenOnb=true; openDetail(d.lineup.id,'map'); } }).catch(()=>{}); }
}
// синхронизация с сервером (если бэкенд подключён); иначе остаёмся на localStorage
function syncWithServer(){
  if(!CFG.enabled){ SYNC_ERR='config-off'; openStartParam(); return; }
  api('/api/sync',{}).catch(e=>{ SYNC_ERR='sync:'+e; return Promise.reject(e); }).then(d=>{
    if(d){
      if(Array.isArray(d.community)) d.community.forEach(cl=>{ const ex=LINEUPS.find(x=>x.id===cl.id); if(ex)Object.assign(ex,cl); else { if(cl.mine)cl.auth=0; LINEUPS.push(cl); } });
      if(Array.isArray(d.saved)){ const S=new Set(d.saved); LINEUPS.forEach(l=>l.saved=S.has(l.id)); persist(); }
      if(Array.isArray(d.visited)){ const V=new Set(d.visited); LINEUPS.forEach(l=>{ if(V.has(l.id))l.visited=true; }); persistVisited(); }
      if(d.maps){ Object.keys(d.maps).forEach(k=>{ MAP_IMG[k]=(CFG.apiBase||'')+'/api/mapimg?map='+k; }); }
      IS_ADMIN=!!d.admin;
      SERVER_OK=true;
      if(state.view==='map'||state.view==='list'||state.view==='feed'||state.view==='profile') render();
    }
    openStartParam();
  }).catch(()=>{ openStartParam(); });
}

if(state.seenOnb){ state.view='map'; } else { state.view='onb0'; }
render();
syncWithServer();
</script>
