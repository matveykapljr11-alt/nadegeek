# Lineups — деплой на Render.
services:
  - type: web
    name: lineups
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node lineups-server.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN          # токен бота из @BotFather (строгая проверка initData)
        sync: false
      - key: BOT_USERNAME       # username бота без @ (для ссылок «поделиться»)
        sync: false
      - key: APP_NAME           # short name Mini App из BotFather /newapp (для t.me/<bot>/<app>)
        sync: false
      - key: AUTO_APPROVE       # "1" — предложенные раскидки публикуются сразу; "0" — модерация
        value: "1"
      - key: STORAGE_CHAT_ID    # (опц.) id канала-склада для видео; пусто = чат загрузившего
        sync: false
      - key: KV_URL             # Upstash Redis REST URL — постоянное хранилище данных
        sync: false
      - key: KV_TOKEN           # Upstash Redis REST token
        sync: false
# ПОСТОЯННОЕ ХРАНИЛИЩЕ: задай KV_URL + KV_TOKEN (Upstash Redis, бесплатно) — тогда
# раскидки/сейвы переживают засыпание и передеплой. Без них данные лежат в
# lineups-data.json и сбрасываются на Render free (диска нет). Видео всегда в Telegram.
